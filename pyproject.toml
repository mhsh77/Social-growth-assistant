[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-growth-assistant"
version = "0.1.0"
description = "Finds relevant X posts you've already browsed and drafts replies for you to approve. Never posts on its own."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11,<2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sga = "sga.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
